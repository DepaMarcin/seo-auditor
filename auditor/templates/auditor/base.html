{% load static %}<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}SEO Auditor{% endblock %}</title>
    <style>
        :root {
            /* --- Dark Agency Theme --- */
            --bg: #0B0F19;
            --panel: #1E293B;
            --surface-inset: #0F172A;
            --border: #334155;
            --text: #F8FAFC;
            --muted: #94A3B8;
            --accent: #00E676;
            --accent-ink: #00E676;
            --ok: #10B981;
            --warning: #F59E0B;
            --error: #EF4444;
            --dark-surface: #0F172A;
            --dark-surface-text: #F8FAFC;
            --card-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: -apple-system, Segoe UI, Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
        }
        header {
            padding: 1.5rem 2rem;
            border-bottom: 1px solid var(--border);
            background: var(--panel);
        }
        header a {
            color: var(--text);
            text-decoration: none;
            font-size: 1.25rem;
            font-weight: 600;
        }
        main {
            max-width: 900px;
            margin: 0 auto;
            padding: 2rem;
        }
        .panel {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            box-shadow: var(--card-shadow);
        }
        form.audit-form {
            display: flex;
            gap: 0.5rem;
        }
        input[type="url"] {
            flex: 1;
            padding: 0.6rem 0.8rem;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: var(--surface-inset);
            color: var(--text);
        }
        form.ga4-select-form {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            margin-top: 1rem;
        }
        select {
            flex: 1;
            min-width: 260px;
            padding: 0.6rem 0.8rem;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: var(--surface-inset);
            color: var(--text);
            font: inherit;
        }
        button {
            padding: 0.6rem 1.2rem;
            border-radius: 6px;
            border: none;
            background: var(--accent);
            color: #000000;
            font-weight: 700;
            cursor: pointer;
        }
        button:hover { opacity: 0.9; }
        button:disabled { opacity: 0.6; cursor: not-allowed; }
        input:disabled { opacity: 0.6; cursor: not-allowed; }
        .hidden { display: none; }
        .loading-container {
            background: var(--surface-inset);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1.25rem 1.5rem;
            margin-top: 1rem;
            box-shadow: var(--card-shadow);
        }
        .loading-header {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            font-weight: 600;
        }
        .spinner {
            width: 1rem;
            height: 1rem;
            flex-shrink: 0;
            border: 2px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .btn-spinner {
            display: inline-block;
            width: 0.9rem;
            height: 0.9rem;
            margin-right: 0.5rem;
            vertical-align: -2px;
            border: 2px solid rgba(0, 0, 0, 0.25);
            border-top-color: #000000;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        .progress-track {
            width: 100%;
            height: 10px;
            background: var(--border);
            border: 1px solid var(--border);
            border-radius: 999px;
            overflow: hidden;
            margin-top: 1rem;
        }
        .progress-bar {
            height: 100%;
            width: 0%;
            background: var(--accent);
            border-radius: 999px;
            transition: width 0.4s ease;
        }
        .loading-status {
            margin: 0.75rem 0 0;
            color: var(--muted);
            font-size: 0.9rem;
        }
        table { width: 100%; border-collapse: collapse; }
        th, td { text-align: left; padding: 0.6rem; border-bottom: 1px solid var(--border); }
        th { color: var(--muted); font-weight: 600; font-size: 0.85rem; text-transform: uppercase; }
        tr:last-child td { border-bottom: none; }
        a.link { color: var(--accent-ink); text-decoration: none; font-weight: 600; }
        a.link:hover { text-decoration: underline; }
        .badge {
            display: inline-block;
            padding: 0.15rem 0.6rem;
            border-radius: 999px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
        }
        .badge-pending, .badge-processing { background: rgba(148, 163, 184, 0.15); color: var(--muted); }
        .badge-completed, .badge-ok { background: rgba(16, 185, 129, 0.15); color: var(--ok); }
        .badge-failed, .badge-error { background: rgba(239, 68, 68, 0.15); color: var(--error); }
        .badge-warning { background: rgba(245, 158, 11, 0.18); color: var(--warning); }
        .messages { list-style: none; padding: 0; margin: 0 0 1rem; }
        .messages li {
            padding: 0.6rem 1rem;
            border-radius: 6px;
            border: 1px solid transparent;
            margin-bottom: 0.5rem;
        }
        /* Sukces / informacja - ciemnozielone tło, jasnozielony tekst i obramowanie. */
        .messages li.message-success,
        .messages li.message-info {
            background: rgba(20, 83, 45, 0.4);
            border-color: #22c55e;
            color: #86efac;
        }
        /* Błąd / ostrzeżenie - ciemnoczerwone tło, jasnoczerwony tekst i obramowanie. */
        .messages li.message-error,
        .messages li.message-warning {
            background: rgba(127, 29, 29, 0.4);
            border-color: var(--error);
            color: #fca5a5;
        }
        .score { font-size: 2.5rem; font-weight: 700; }
        .metric-key { color: var(--muted); font-size: 0.8rem; }
        h2 { text-transform: capitalize; }
        .cwv-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 0.75rem;
            margin-bottom: 1rem;
        }
        .cwv-tile {
            border-radius: 8px;
            padding: 1rem;
            background: var(--surface-inset);
            border: 1px solid var(--border);
            border-top: 3px solid var(--muted);
        }
        .cwv-tile.cwv-ok { border-top-color: var(--ok); }
        .cwv-tile.cwv-warning { border-top-color: var(--warning); }
        .cwv-tile.cwv-error { border-top-color: var(--error); }
        .cwv-label { color: var(--muted); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.03em; }
        .cwv-value { font-size: 1.6rem; font-weight: 700; margin: 0.15rem 0; }
        .cwv-tile.cwv-ok .cwv-value { color: var(--ok); }
        .cwv-tile.cwv-warning .cwv-value { color: var(--warning); }
        .cwv-tile.cwv-error .cwv-value { color: var(--error); }
        .cwv-note { font-size: 0.8rem; color: var(--muted); }
        .score-preview { display: flex; gap: 1rem; margin-bottom: 1.25rem; flex-wrap: wrap; }
        .score-preview-item {
            background: var(--surface-inset);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 0.75rem 1.5rem;
        }
        /* --- Główny przełącznik widoków strony audytu: Widoczność i Ruch / Audyt
           Techniczny & PageSpeed - czysty JS, przełącza klasę .hidden na panelach. --- */
        .detail-tabs {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
            border-bottom: 1px solid var(--border);
        }
        .detail-tab-btn {
            padding: 0.75rem 1.25rem;
            margin-bottom: -1px;
            background: transparent;
            border: none;
            border-bottom: 3px solid transparent;
            border-radius: 0;
            color: var(--muted);
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
        }
        .detail-tab-btn:hover { color: var(--text); }
        .detail-tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }

        .tabs { margin-top: 0.5rem; }
        .tab-input { display: none; }
        .tab-label {
            display: inline-block;
            padding: 0.5rem 1.25rem;
            margin-right: 0.4rem;
            border-radius: 8px 8px 0 0;
            background: var(--surface-inset);
            border: 1px solid var(--border);
            border-bottom: none;
            color: var(--muted);
            font-weight: 600;
            cursor: pointer;
        }
        .tab-panel {
            display: none;
            padding: 1rem 0 0;
            border-top: 1px solid var(--border);
        }
        #tab-mobile:checked ~ label[for="tab-mobile"],
        #tab-desktop:checked ~ label[for="tab-desktop"] {
            background: var(--panel);
            color: var(--text);
            border-color: var(--accent);
        }
        #tab-mobile:checked ~ #panel-mobile,
        #tab-desktop:checked ~ #panel-desktop {
            display: block;
        }
        .structure-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 0.75rem;
        }
        .structure-card {
            background: var(--surface-inset);
            border: 1px solid var(--border);
            border-left: 4px solid var(--muted);
            border-radius: 8px;
            padding: 1rem;
            box-shadow: var(--card-shadow);
        }
        .structure-card.status-ok { border-left-color: var(--ok); }
        .structure-card.status-warning { border-left-color: var(--warning); }
        .structure-card.status-error { border-left-color: var(--error); }

        /* --- Executive Summary: statystyki, priorytety, zdane testy --- */
        .stats-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 0.75rem;
            margin-top: 1.25rem;
        }
        .stat-tile {
            background: var(--surface-inset);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1rem;
            text-align: center;
        }
        .stat-tile .stat-value { font-size: 1.9rem; font-weight: 700; line-height: 1.2; }
        .stat-tile .stat-label { color: var(--muted); font-size: 0.8rem; margin-top: 0.25rem; }
        .stat-tile.stat-errors { border-color: rgba(239, 68, 68, 0.4); }
        .stat-tile.stat-errors .stat-value { color: var(--error); }
        .stat-tile.stat-warnings { border-color: rgba(245, 158, 11, 0.4); }
        .stat-tile.stat-warnings .stat-value { color: var(--warning); }
        .stat-tile.stat-passed { border-color: rgba(16, 185, 129, 0.4); }
        .stat-tile.stat-passed .stat-value { color: var(--ok); }

        /* --- Analiza Widoczności (Senuto): karty TOP3/TOP10/TOP50 + wykres liniowy --- */
        .senuto-stats-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 0.75rem;
            margin: 1rem 0 1.25rem;
        }
        .stat-tile.stat-senuto { border-color: rgba(0, 230, 118, 0.3); }
        .stat-tile.stat-senuto .stat-value { color: var(--accent); }
        /* Kafelki TOP3/TOP10/TOP50 są jednocześnie przyciskami przełączającymi serię
           na wykresie widoczności - stąd reset stylów natywnego <button> i stan .active. */
        .senuto-tab {
            cursor: pointer;
            display: block;
            width: 100%;
            font: inherit;
            color: inherit;
            transition: border-color 0.15s ease;
        }
        .senuto-tab:hover { border-color: var(--accent); }
        .senuto-tab:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
        .senuto-tab.active { border: 2px solid #00E676; }
        .senuto-chart-wrap {
            background: var(--surface-inset);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1rem;
        }

        /* --- Ruch organiczny (Google Analytics 4) - przycisk połączenia OAuth --- */
        .ga4-connect-box {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 0.75rem;
        }

        /* --- GA4: analiza wielokanałowa, boks wniosków, formularz wyboru leadu --- */
        .ga4-subheading {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.03em;
            color: var(--muted);
            font-weight: 700;
            margin: 1.5rem 0 0.5rem;
        }
        .ga4-insights-box {
            margin-top: 0.5rem;
            padding: 1rem 1.25rem;
            border-left: 4px solid var(--accent);
            background: rgba(0, 230, 118, 0.06);
            border-radius: 8px;
        }
        .ga4-insights-box.ga4-insights-warning {
            border-left-color: var(--error);
            background: rgba(239, 68, 68, 0.08);
        }
        .ga4-insights-heading { font-weight: 700; margin-bottom: 0.5rem; }
        .ga4-insights-list { margin: 0; padding-left: 1.2rem; }
        .ga4-insights-list li { margin-bottom: 0.35rem; }
        .ga4-insights-list li:last-child { margin-bottom: 0; }
        .ga4-lead-form { margin-top: 0.5rem; }

        /* --- Checkboxy przełączające widoczność kanałów na wykresie ruchu --- */
        .ga4-channel-toggles {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin: 0.5rem 0 0.75rem;
        }
        .ga4-channel-toggle {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.3rem 0.7rem;
            border-radius: 999px;
            border: 1px solid var(--border);
            background: var(--surface-inset);
            font-size: 0.8rem;
            cursor: pointer;
            user-select: none;
        }
        .ga4-channel-toggle input[type="checkbox"] {
            accent-color: var(--toggle-color, var(--accent));
            cursor: pointer;
        }

        /* --- Osobna sekcja wykresu i wniosków dla leadów/konwersji --- */
        .ga4-leads-section {
            margin-top: 1.75rem;
            padding-top: 1.5rem;
            border-top: 1px solid var(--border);
        }
        .ga4-insights-box.ga4-insights-leads {
            border-left-color: #4285F4;
            background: rgba(66, 133, 244, 0.08);
        }

        /* --- Analiza Fraz Kluczowych (Google Search Console) - karta 3M YoY + tabele --- */
        .gsc-summary-card {
            display: flex;
            align-items: center;
            gap: 1rem;
            flex-wrap: wrap;
            padding: 1rem 1.25rem;
            background: var(--surface-inset);
            border: 1px solid var(--border);
            border-radius: 12px;
            margin-bottom: 1.25rem;
        }
        .gsc-summary-numbers { display: flex; align-items: baseline; gap: 0.5rem; flex-wrap: wrap; }
        .gsc-summary-current { font-size: 1.6rem; font-weight: 700; color: var(--text); }
        .gsc-summary-vs { color: var(--muted); font-size: 0.85rem; }
        .gsc-summary-previous { font-size: 1.1rem; color: var(--muted); }
        .gsc-summary-label { color: var(--muted); font-size: 0.8rem; }
        .gsc-tables-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.25rem;
        }
        .gsc-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
        .gsc-table th {
            text-align: left;
            padding: 0.5rem 0.6rem;
            color: var(--muted);
            font-weight: 600;
            font-size: 0.72rem;
            text-transform: uppercase;
            border-bottom: 1px solid var(--border);
        }
        .gsc-table td {
            padding: 0.5rem 0.6rem;
            border-bottom: 1px solid var(--border);
            word-break: break-word;
        }
        .gsc-table tr:last-child td { border-bottom: none; }
        .gsc-delta-positive { color: var(--ok); font-weight: 700; }
        .gsc-delta-negative { color: var(--error); font-weight: 700; }
        .gsc-commentary-text { margin: 0; color: var(--muted); line-height: 1.5; }

        /* --- Zakładka "Audyt Techniczny": 4 akordeony + karty testów --- */
        .tech-accordion-list { display: flex; flex-direction: column; gap: 0.75rem; }
        .tech-accordion {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
        }
        .tech-accordion-summary {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.75rem;
            padding: 1rem 1.25rem;
            cursor: pointer;
            list-style: none;
            font-weight: 700;
            color: var(--text);
        }
        .tech-accordion-summary::-webkit-details-marker { display: none; }
        .tech-accordion-summary::before { content: "▶ "; color: var(--muted); font-weight: 400; }
        .tech-accordion[open] > .tech-accordion-summary::before { content: "▼ "; }
        .tech-accordion-count {
            flex-shrink: 0;
            background: var(--surface-inset);
            color: var(--muted);
            border: 1px solid var(--border);
            border-radius: 999px;
            padding: 0.1rem 0.6rem;
            font-size: 0.75rem;
            font-weight: 700;
        }
        .tech-accordion-body {
            padding: 0 1.25rem 1.25rem;
            border-top: 1px solid var(--border);
        }

        .test-card-list { display: flex; flex-direction: column; gap: 0.75rem; margin-top: 1rem; }
        .test-card {
            background: var(--surface-inset);
            border: 1px solid var(--border);
            border-left: 4px solid var(--muted);
            border-radius: 8px;
            padding: 1rem;
        }
        .test-card.status-ok, .test-card.status-info { border-left-color: var(--ok); }
        .test-card.status-warning {
            border-color: rgba(245, 158, 11, 0.4);
            border-left-color: var(--warning);
            background: rgba(245, 158, 11, 0.05);
        }
        .test-card.status-error {
            border-color: rgba(239, 68, 68, 0.4);
            border-left-color: var(--error);
            background: rgba(239, 68, 68, 0.05);
        }
        .test-card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.75rem;
            flex-wrap: wrap;
        }
        .test-card-title { font-weight: 700; color: var(--text); }
        .test-card-summary { margin: 0.4rem 0 0; color: var(--muted); }
        .test-card-details { margin-top: 0.6rem; }
        .test-card-details summary {
            cursor: pointer;
            color: var(--accent);
            font-size: 0.85rem;
            font-weight: 600;
            list-style: none;
        }
        .test-card-details summary::-webkit-details-marker { display: none; }
        .test-card-details summary::before { content: "▸ "; }
        .test-card-details[open] summary::before { content: "▾ "; }
        .test-card-details-body { margin-top: 0.6rem; }
        .status-flag.status-info { background: #38BDF8; color: #000000; }

        .section-heading {
            font-size: 1.1rem;
            margin: 0 0 1rem;
        }

        .priority-panel {
            border-radius: 10px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            border: 1px solid var(--border);
            box-shadow: var(--card-shadow);
        }
        .priority-panel.critical {
            background: rgba(239, 68, 68, 0.05);
            border-color: rgba(239, 68, 68, 0.3);
        }
        .priority-panel.warning-panel {
            background: rgba(245, 158, 11, 0.06);
            border-color: rgba(245, 158, 11, 0.3);
        }
        .priority-panel .section-heading.critical-heading { color: var(--error); }
        .priority-panel .section-heading.warning-heading { color: var(--warning); }
        .priority-card {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1rem;
            margin-bottom: 0.75rem;
        }
        .priority-card:last-child { margin-bottom: 0; }
        .priority-card.critical-card { border-left: 4px solid var(--error); }
        .priority-card.warning-card { border-left: 4px solid var(--warning); }
        .priority-card-header {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 0.4rem;
            flex-wrap: wrap;
        }
        .priority-card-title { font-weight: 600; }
        .category-tag {
            font-size: 0.7rem;
            text-transform: uppercase;
            color: var(--muted);
            background: rgba(100, 116, 139, 0.15);
            padding: 0.1rem 0.5rem;
            border-radius: 999px;
        }
        .priority-note { margin: 0.25rem 0 0; word-break: break-all; white-space: pre-wrap; overflow-wrap: anywhere; }
        .priority-empty { color: var(--muted); font-style: italic; margin: 0; }

        .report-section { margin-top: 2rem; }
        .report-section > .section-heading { margin-bottom: 1rem; }

        details.passed-tests {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1.25rem 1.5rem;
            box-shadow: var(--card-shadow);
        }
        details.passed-tests summary {
            cursor: pointer;
            font-weight: 600;
            list-style: none;
        }
        details.passed-tests summary::-webkit-details-marker { display: none; }
        details.passed-tests summary::before { content: "▶ "; color: var(--muted); }
        details.passed-tests[open] summary::before { content: "▼ "; }
        .passed-list { margin-top: 1rem; }
        .passed-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 0.75rem;
            padding: 0.5rem 0;
            border-bottom: 1px solid var(--border);
            font-size: 0.9rem;
        }
        .passed-item:last-child { border-bottom: none; }
        .passed-item .passed-category { color: var(--muted); font-size: 0.75rem; text-transform: uppercase; }

        /* --- Zastany element ze strony (snippet) - świadomie ciemny, dla kontrastu i czytelności kodu --- */
        .snippet-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.03em;
            color: var(--muted);
            margin: 0.6rem 0 0.25rem;
        }
        .snippet-box {
            padding: 0.6rem 0.8rem;
            background: var(--dark-surface);
            color: var(--dark-surface-text);
            border: 1px solid var(--dark-surface);
            border-radius: 6px;
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            font-size: 0.85rem;
            white-space: pre-wrap;
            word-break: break-all;
            overflow-wrap: anywhere;
            max-width: 100%;
        }
        .metric-row { padding: 0.75rem 0; border-bottom: 1px solid var(--border); }
        .metric-row:last-child { border-bottom: none; }
        .metric-note { margin: 0.35rem 0 0; }

        /* --- Panel "Przegląd": wykres kołowy, paski kategorii, podgląd strony --- */
        .overview-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(200px, 1fr));
            gap: 1.5rem;
            margin: 1.25rem 0 0.5rem;
        }
        @media (max-width: 720px) {
            .overview-grid { grid-template-columns: 1fr; }
        }
        .overview-col { display: flex; flex-direction: column; gap: 0.75rem; }
        .overview-score-col { align-items: center; text-align: center; justify-content: flex-start; }
        .score-donut {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: conic-gradient(var(--donut-color, var(--accent)) calc(var(--score) * 1%), var(--border) 0);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .score-donut.score-donut-ok { --donut-color: var(--ok); }
        .score-donut.score-donut-warning { --donut-color: var(--warning); }
        .score-donut.score-donut-error { --donut-color: var(--error); }
        .score-donut-inner {
            width: 116px;
            height: 116px;
            border-radius: 50%;
            background: var(--panel);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: var(--card-shadow);
        }
        .score-donut-value { font-size: 2.1rem; font-weight: 700; line-height: 1; color: var(--text); }
        .score-donut-label { font-size: 0.7rem; color: var(--muted); text-transform: uppercase; margin-top: 0.2rem; }
        .pdf-button {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.6rem 1.1rem;
            border-radius: 6px;
            background: var(--accent);
            color: #000000;
            font-weight: 700;
            text-decoration: none;
            font-size: 0.9rem;
        }
        .pdf-button:hover { opacity: 0.9; }
        .overview-bars-col { justify-content: center; }
        .category-bar-header {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            margin-bottom: 0.3rem;
        }
        .category-bar { margin-bottom: 0.9rem; }
        .category-bar:last-child { margin-bottom: 0; }
        .page-preview-card {
            background: var(--surface-inset);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 0.75rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            align-items: center;
            box-shadow: var(--card-shadow);
        }
        .page-preview-frame {
            width: 100%;
            aspect-ratio: 4 / 3;
            overflow: hidden;
            border-radius: 6px;
            border: 1px solid var(--border);
            position: relative;
            background: #fff;
        }
        .page-preview-frame iframe {
            width: 400%;
            height: 400%;
            transform: scale(0.25);
            transform-origin: 0 0;
            border: 0;
            pointer-events: none;
        }

        /* --- Modułowe karty metryk (zastępują dawną tabelę "Problemy i rekomendacje") --- */
        .metric-card-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        .metric-card {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.25rem;
        }
        .metric-card-header {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 0.9rem;
            flex-wrap: wrap;
        }
        .metric-card-icon { font-size: 1.4rem; line-height: 1; }
        .metric-card-heading { flex: 1; min-width: 0; }
        .metric-card-title { font-weight: 700; color: var(--text); }
        .metric-card-category {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.03em;
            color: var(--muted);
            margin-top: 0.15rem;
        }
        .status-flag {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            border-radius: 999px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            color: #000000;
            white-space: nowrap;
        }
        .status-flag.status-error { background: var(--error); color: #ffffff; }
        .status-flag.status-warning { background: var(--warning); }
        .status-flag.status-ok { background: var(--ok); color: #ffffff; }
        .metric-card-section { margin-top: 0.9rem; }
        .metric-card-section:first-of-type { margin-top: 0; }
        .metric-card-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.03em;
            color: var(--muted);
            font-weight: 700;
            margin-bottom: 0.4rem;
        }
        .metric-definition p {
            margin: 0;
            color: var(--muted);
            font-size: 0.9rem;
            line-height: 1.5;
        }
        .metric-card-section .snippet-box { margin-top: 0.4rem; }

        /* --- Rekomendacje AI + bloki kodu z przyciskiem Kopiuj --- */
        .recommendation {
            margin-top: 0.9rem;
            padding: 0.6rem 0.8rem;
            border-left: 4px solid var(--accent);
            background: rgba(0, 230, 118, 0.08);
            font-size: 0.9rem;
            max-width: 100%;
        }
        .recommendation p {
            margin: 0.3rem 0;
            word-break: break-all;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }
        .recommendation p:first-child { margin-top: 0; }
        .recommendation-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.03em;
            color: var(--accent-ink);
            font-weight: 700;
            margin-bottom: 0.3rem;
        }
        .code-frame {
            margin: 0.5rem 0;
            border: 1px solid var(--dark-surface);
            border-radius: 6px;
            overflow: hidden;
            background: var(--dark-surface);
            max-width: 100%;
        }
        .code-frame-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.3rem 0.6rem;
            background: rgba(248, 250, 252, 0.08);
            font-size: 0.7rem;
            text-transform: uppercase;
            color: rgba(248, 250, 252, 0.65);
        }
        .copy-btn {
            padding: 0.15rem 0.6rem;
            font-size: 0.7rem;
            font-weight: 700;
            border-radius: 4px;
            border: none;
            background: rgba(248, 250, 252, 0.15);
            color: var(--dark-surface-text);
            cursor: pointer;
        }
        .copy-btn:hover { background: var(--accent); color: #000000; }
        .code-frame pre {
            margin: 0;
            padding: 0.7rem 0.8rem;
            max-width: 100%;
            white-space: pre-wrap;
            word-break: break-all;
            overflow-wrap: anywhere;
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            font-size: 0.8rem;
            color: var(--dark-surface-text);
        }
        .code-frame pre code { color: inherit; }
    </style>
</head>
<body>
<header>
    <a href="{% url 'auditor:index' %}">SEO Auditor · silnik RAG</a>
</header>
<main>
    {% if messages %}
    <ul class="messages">
        {% for message in messages %}
        <li class="message-{{ message.tags }}">{{ message }}</li>
        {% endfor %}
    </ul>
    {% endif %}
    {% block content %}{% endblock %}
</main>
<script>
document.addEventListener("click", function (event) {
    var btn = event.target.closest("[data-copy]");
    if (!btn) return;
    var frame = btn.closest(".code-frame");
    var codeEl = frame ? frame.querySelector("code") : null;
    if (!codeEl) return;

    var restoreLabel = function (label) {
        setTimeout(function () { btn.textContent = label; }, 1500);
    };

    if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(codeEl.textContent).then(function () {
            var original = btn.textContent;
            btn.textContent = "Skopiowano!";
            restoreLabel(original);
        }).catch(function () {
            btn.textContent = "Błąd kopiowania";
            restoreLabel("Kopiuj kod");
        });
    } else {
        var range = document.createRange();
        range.selectNodeContents(codeEl);
        var selection = window.getSelection();
        selection.removeAllRanges();
        selection.addRange(range);
        try {
            document.execCommand("copy");
            btn.textContent = "Skopiowano!";
        } catch (err) {
            btn.textContent = "Błąd kopiowania";
        }
        selection.removeAllRanges();
        restoreLabel("Kopiuj kod");
    }
});
</script>
</body>
</html>
