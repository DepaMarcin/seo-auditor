{% load static %}<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}SEO Auditor{% endblock %}</title>
    <style>
        :root {
            --bg: #0f172a;
            --panel: #1e293b;
            --border: #334155;
            --text: #e2e8f0;
            --muted: #94a3b8;
            --accent: #38bdf8;
            --ok: #22c55e;
            --warning: #eab308;
            --error: #ef4444;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: -apple-system, Segoe UI, Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
        }
        header {
            padding: 1.5rem 2rem;
            border-bottom: 1px solid var(--border);
        }
        header a {
            color: var(--text);
            text-decoration: none;
            font-size: 1.25rem;
            font-weight: 600;
        }
        main {
            max-width: 900px;
            margin: 0 auto;
            padding: 2rem;
        }
        .panel {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
        }
        form.audit-form {
            display: flex;
            gap: 0.5rem;
        }
        input[type="url"] {
            flex: 1;
            padding: 0.6rem 0.8rem;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: #0b1220;
            color: var(--text);
        }
        button {
            padding: 0.6rem 1.2rem;
            border-radius: 6px;
            border: none;
            background: var(--accent);
            color: #0b1220;
            font-weight: 600;
            cursor: pointer;
        }
        button:hover { opacity: 0.9; }
        button:disabled { opacity: 0.6; cursor: not-allowed; }
        input:disabled { opacity: 0.6; cursor: not-allowed; }
        .hidden { display: none; }
        .loading-container {
            background: #0b1220;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1.25rem 1.5rem;
            margin-top: 1rem;
        }
        .loading-header {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            font-weight: 600;
        }
        .spinner {
            width: 1rem;
            height: 1rem;
            flex-shrink: 0;
            border: 2px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .progress-track {
            width: 100%;
            height: 10px;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 999px;
            overflow: hidden;
            margin-top: 1rem;
        }
        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--accent), var(--ok));
            border-radius: 999px;
            transition: width 0.4s ease;
        }
        .loading-status {
            margin: 0.75rem 0 0;
            color: var(--muted);
            font-size: 0.9rem;
        }
        table { width: 100%; border-collapse: collapse; }
        th, td { text-align: left; padding: 0.6rem; border-bottom: 1px solid var(--border); }
        th { color: var(--muted); font-weight: 500; font-size: 0.85rem; text-transform: uppercase; }
        tr:last-child td { border-bottom: none; }
        a.link { color: var(--accent); text-decoration: none; }
        a.link:hover { text-decoration: underline; }
        .badge {
            display: inline-block;
            padding: 0.15rem 0.6rem;
            border-radius: 999px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
        }
        .badge-pending, .badge-processing { background: rgba(148, 163, 184, 0.2); color: var(--muted); }
        .badge-completed, .badge-ok { background: rgba(34, 197, 94, 0.15); color: var(--ok); }
        .badge-failed, .badge-error { background: rgba(239, 68, 68, 0.15); color: var(--error); }
        .badge-warning { background: rgba(234, 179, 8, 0.15); color: var(--warning); }
        .messages { list-style: none; padding: 0; margin: 0 0 1rem; }
        .messages li { padding: 0.6rem 1rem; border-radius: 6px; background: rgba(239, 68, 68, 0.15); color: var(--error); margin-bottom: 0.5rem; }
        .score { font-size: 2.5rem; font-weight: 700; }
        .metric-key { color: var(--muted); font-size: 0.8rem; }
        .recommendation {
            margin-top: 0.4rem;
            padding: 0.6rem 0.8rem;
            border-left: 3px solid var(--accent);
            background: rgba(56, 189, 248, 0.08);
            font-size: 0.9rem;
        }
        h2 { text-transform: capitalize; }
        .cwv-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 0.75rem;
            margin-bottom: 1rem;
        }
        .cwv-tile {
            border-radius: 8px;
            padding: 1rem;
            background: #0b1220;
            border: 1px solid var(--border);
            border-top: 3px solid var(--muted);
        }
        .cwv-tile.cwv-ok { border-top-color: var(--ok); }
        .cwv-tile.cwv-warning { border-top-color: var(--warning); }
        .cwv-tile.cwv-error { border-top-color: var(--error); }
        .cwv-label { color: var(--muted); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.03em; }
        .cwv-value { font-size: 1.6rem; font-weight: 700; margin: 0.15rem 0; }
        .cwv-tile.cwv-ok .cwv-value { color: var(--ok); }
        .cwv-tile.cwv-warning .cwv-value { color: var(--warning); }
        .cwv-tile.cwv-error .cwv-value { color: var(--error); }
        .cwv-note { font-size: 0.8rem; color: var(--muted); }
        .score-preview { display: flex; gap: 1rem; margin-bottom: 1.25rem; flex-wrap: wrap; }
        .score-preview-item {
            background: #0b1220;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 0.75rem 1.5rem;
        }
        .tabs { margin-top: 0.5rem; }
        .tab-input { display: none; }
        .tab-label {
            display: inline-block;
            padding: 0.5rem 1.25rem;
            margin-right: 0.4rem;
            border-radius: 8px 8px 0 0;
            background: #0b1220;
            border: 1px solid var(--border);
            border-bottom: none;
            color: var(--muted);
            font-weight: 600;
            cursor: pointer;
        }
        .tab-panel {
            display: none;
            padding: 1rem 0 0;
            border-top: 1px solid var(--border);
        }
        #tab-mobile:checked ~ label[for="tab-mobile"],
        #tab-desktop:checked ~ label[for="tab-desktop"] {
            background: var(--panel);
            color: var(--text);
            border-color: var(--accent);
        }
        #tab-mobile:checked ~ #panel-mobile,
        #tab-desktop:checked ~ #panel-desktop {
            display: block;
        }
        .structure-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 0.75rem;
        }
        .structure-card {
            background: #0b1220;
            border: 1px solid var(--border);
            border-left: 4px solid var(--muted);
            border-radius: 8px;
            padding: 1rem;
        }
        .structure-card.status-ok { border-left-color: var(--ok); }
        .structure-card.status-warning { border-left-color: var(--warning); }
        .structure-card.status-error { border-left-color: var(--error); }

        /* --- Executive Summary: statystyki, priorytety, zdane testy --- */
        .stats-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 0.75rem;
            margin-top: 1.25rem;
        }
        .stat-tile {
            background: #0b1220;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1rem;
            text-align: center;
        }
        .stat-tile .stat-value { font-size: 1.9rem; font-weight: 700; line-height: 1.2; }
        .stat-tile .stat-label { color: var(--muted); font-size: 0.8rem; margin-top: 0.25rem; }
        .stat-tile.stat-errors { border-color: rgba(239, 68, 68, 0.4); }
        .stat-tile.stat-errors .stat-value { color: var(--error); }
        .stat-tile.stat-warnings { border-color: rgba(234, 179, 8, 0.4); }
        .stat-tile.stat-warnings .stat-value { color: var(--warning); }
        .stat-tile.stat-passed { border-color: rgba(34, 197, 94, 0.4); }
        .stat-tile.stat-passed .stat-value { color: var(--ok); }

        .section-heading {
            font-size: 1.1rem;
            margin: 0 0 1rem;
        }

        .priority-panel {
            border-radius: 10px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            border: 1px solid var(--border);
        }
        .priority-panel.critical {
            background: rgba(239, 68, 68, 0.07);
            border-color: rgba(239, 68, 68, 0.35);
        }
        .priority-panel.warning-panel {
            background: rgba(234, 179, 8, 0.07);
            border-color: rgba(234, 179, 8, 0.35);
        }
        .priority-panel .section-heading.critical-heading { color: var(--error); }
        .priority-panel .section-heading.warning-heading { color: var(--warning); }
        .priority-card {
            background: #0b1220;
            border-radius: 8px;
            padding: 1rem;
            margin-bottom: 0.75rem;
        }
        .priority-card:last-child { margin-bottom: 0; }
        .priority-card.critical-card { border-left: 4px solid var(--error); }
        .priority-card.warning-card { border-left: 4px solid var(--warning); }
        .priority-card-header {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 0.4rem;
            flex-wrap: wrap;
        }
        .priority-card-title { font-weight: 600; }
        .category-tag {
            font-size: 0.7rem;
            text-transform: uppercase;
            color: var(--muted);
            background: rgba(148, 163, 184, 0.15);
            padding: 0.1rem 0.5rem;
            border-radius: 999px;
        }
        .priority-note { margin: 0.25rem 0 0; }
        .priority-empty { color: var(--muted); font-style: italic; margin: 0; }

        .report-section { margin-top: 2rem; }
        .report-section > .section-heading { margin-bottom: 1rem; }

        details.passed-tests {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1.25rem 1.5rem;
        }
        details.passed-tests summary {
            cursor: pointer;
            font-weight: 600;
            list-style: none;
        }
        details.passed-tests summary::-webkit-details-marker { display: none; }
        details.passed-tests summary::before { content: "▶ "; color: var(--muted); }
        details.passed-tests[open] summary::before { content: "▼ "; }
        .passed-list { margin-top: 1rem; }
        .passed-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 0.75rem;
            padding: 0.5rem 0;
            border-bottom: 1px solid var(--border);
            font-size: 0.9rem;
        }
        .passed-item:last-child { border-bottom: none; }
        .passed-item .passed-category { color: var(--muted); font-size: 0.75rem; text-transform: uppercase; }

        /* --- Zastany element ze strony (snippet) --- */
        .snippet-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.03em;
            color: var(--muted);
            margin: 0.6rem 0 0.25rem;
        }
        .snippet-box {
            padding: 0.6rem 0.8rem;
            background: #0b1220;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            font-size: 0.85rem;
            color: var(--text);
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }
        .metric-row { padding: 0.75rem 0; border-bottom: 1px solid var(--border); }
        .metric-row:last-child { border-bottom: none; }
        .metric-note { margin: 0.35rem 0 0; }

        /* --- Panel "Przegląd": wykres kołowy, paski kategorii, podgląd strony --- */
        .overview-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(200px, 1fr));
            gap: 1.5rem;
            margin: 1.25rem 0 0.5rem;
        }
        @media (max-width: 720px) {
            .overview-grid { grid-template-columns: 1fr; }
        }
        .overview-col { display: flex; flex-direction: column; gap: 0.75rem; }
        .overview-score-col { align-items: center; text-align: center; justify-content: flex-start; }
        .score-donut {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: conic-gradient(var(--donut-color, var(--accent)) calc(var(--score) * 1%), var(--border) 0);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .score-donut.score-donut-ok { --donut-color: var(--ok); }
        .score-donut.score-donut-warning { --donut-color: var(--warning); }
        .score-donut.score-donut-error { --donut-color: var(--error); }
        .score-donut-inner {
            width: 116px;
            height: 116px;
            border-radius: 50%;
            background: var(--panel);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .score-donut-value { font-size: 2.1rem; font-weight: 700; line-height: 1; }
        .score-donut-label { font-size: 0.7rem; color: var(--muted); text-transform: uppercase; margin-top: 0.2rem; }
        .pdf-button {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.6rem 1.1rem;
            border-radius: 6px;
            background: var(--accent);
            color: #0b1220;
            font-weight: 600;
            text-decoration: none;
            font-size: 0.9rem;
        }
        .pdf-button:hover { opacity: 0.9; }
        .overview-bars-col { justify-content: center; }
        .category-bar-header {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            margin-bottom: 0.3rem;
        }
        .category-bar { margin-bottom: 0.9rem; }
        .category-bar:last-child { margin-bottom: 0; }
        .page-preview-card {
            background: #0b1220;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 0.75rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            align-items: center;
        }
        .page-preview-frame {
            width: 100%;
            aspect-ratio: 4 / 3;
            overflow: hidden;
            border-radius: 6px;
            border: 1px solid var(--border);
            position: relative;
            background: #fff;
        }
        .page-preview-frame iframe {
            width: 400%;
            height: 400%;
            transform: scale(0.25);
            transform-origin: 0 0;
            border: 0;
            pointer-events: none;
        }

        /* --- Tabela "Problemy i rekomendacje" --- */
        .table-scroll { overflow-x: auto; }
        .findings-table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
        .findings-table th {
            text-align: left;
            padding: 0.6rem;
            color: var(--muted);
            font-weight: 600;
            font-size: 0.75rem;
            text-transform: uppercase;
            border-bottom: 1px solid var(--border);
            white-space: nowrap;
        }
        .findings-table td {
            padding: 0.75rem 0.6rem;
            border-bottom: 1px solid var(--border);
            vertical-align: top;
        }
        .findings-table tr:last-child td { border-bottom: none; }
        .findings-table td.col-type,
        .findings-table td.col-test { white-space: nowrap; }
        .findings-table .details-cell { min-width: 260px; }

        /* --- Bloki kodu w rekomendacjach AI + przycisk Kopiuj --- */
        .recommendation {
            margin-top: 0.4rem;
            padding: 0.6rem 0.8rem;
            border-left: 3px solid var(--accent);
            background: rgba(56, 189, 248, 0.08);
            font-size: 0.9rem;
        }
        .recommendation p { margin: 0.3rem 0; }
        .recommendation p:first-child { margin-top: 0; }
        .recommendation-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.03em;
            color: var(--accent);
            font-weight: 700;
            margin-bottom: 0.3rem;
        }
        .code-frame {
            margin: 0.5rem 0;
            border: 1px solid var(--border);
            border-radius: 6px;
            overflow: hidden;
            background: #0b1220;
        }
        .code-frame-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.3rem 0.6rem;
            background: rgba(148, 163, 184, 0.1);
            font-size: 0.7rem;
            text-transform: uppercase;
            color: var(--muted);
        }
        .copy-btn {
            padding: 0.15rem 0.6rem;
            font-size: 0.7rem;
            font-weight: 600;
            border-radius: 4px;
            background: var(--border);
            color: var(--text);
        }
        .copy-btn:hover { background: var(--accent); color: #0b1220; }
        .code-frame pre {
            margin: 0;
            padding: 0.7rem 0.8rem;
            overflow-x: auto;
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            font-size: 0.8rem;
            color: #e2e8f0;
        }
    </style>
</head>
<body>
<header>
    <a href="{% url 'auditor:index' %}">SEO Auditor · silnik RAG</a>
</header>
<main>
    {% if messages %}
    <ul class="messages">
        {% for message in messages %}
        <li>{{ message }}</li>
        {% endfor %}
    </ul>
    {% endif %}
    {% block content %}{% endblock %}
</main>
<script>
document.addEventListener("click", function (event) {
    var btn = event.target.closest("[data-copy]");
    if (!btn) return;
    var frame = btn.closest(".code-frame");
    var codeEl = frame ? frame.querySelector("code") : null;
    if (!codeEl) return;

    var restoreLabel = function (label) {
        setTimeout(function () { btn.textContent = label; }, 1500);
    };

    if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(codeEl.textContent).then(function () {
            var original = btn.textContent;
            btn.textContent = "Skopiowano!";
            restoreLabel(original);
        }).catch(function () {
            btn.textContent = "Błąd kopiowania";
            restoreLabel("Kopiuj");
        });
    } else {
        var range = document.createRange();
        range.selectNodeContents(codeEl);
        var selection = window.getSelection();
        selection.removeAllRanges();
        selection.addRange(range);
        try {
            document.execCommand("copy");
            btn.textContent = "Skopiowano!";
        } catch (err) {
            btn.textContent = "Błąd kopiowania";
        }
        selection.removeAllRanges();
        restoreLabel("Kopiuj");
    }
});
</script>
</body>
</html>
